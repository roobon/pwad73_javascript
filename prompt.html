<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Get user Data</h2>
    <script>
      let num1 = window.prompt("Insert a number", "");
      let num2 = window.prompt("Insert another number", "");

      num1 = parseInt(num1);
      num2 = parseInt(num2);
      let output = num1 + num2; //

      document.write(output);
    </script>
  </body>
</html>
