<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var counter = 0; //Sequence
      var endIt = 14;
      while (counter < endIt) {
        //Loop begins
        if (counter == 7) {
          //Conditional begins
          alert("You are half way through");
        } //Conditional ends
        counter++;
      } //Loop ends
      var message = "Counter value is now:" + counter;
      document.write(message);
    </script>
  </body>
</html>
