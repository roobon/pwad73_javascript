<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function welcome() {
        let name = prompt("Please enter your name:");
        alert("Welcome, " + name + "!");
      }
    </script>
  </head>
  <body>
    <button onclick="welcome()">Click me to be welcomed!</button>
  </body>
</html>
