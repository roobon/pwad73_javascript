<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input
      type="button"
      value="YELLOW"
      onclick="document.body.style.backgroundColor = 'yellow'"
    />
    <input
      type="button"
      value="GREEN"
      onclick="document.body.style.backgroundColor = 'green'"
    />
    <input
      type="button"
      value="BLUE"
      onclick="document.body.style.backgroundColor = 'blue'"
    />
  </body>
</html>
