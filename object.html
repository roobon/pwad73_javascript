<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="show"></div>
    <script>
      const person = {
        name: "Mahir",
        age: 20,
        city: "Dhaka",
        address: "Uttara, Dhaka",
      };

      let info =
        "Name: " +
        person.name +
        "<br>Age: " +
        person.age +
        "<br>City: " +
        person.city +
        "<br>Address: " +
        person.address;
      //document.write(info);
      document.getElementById("show").innerHTML = info;
    </script>
  </body>
</html>
