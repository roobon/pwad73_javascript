<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="" name="myform" onsubmit="return validation();">
      <input type="text" name="username" placeholder="Enter username" /><br />
      <input
        type="password"
        name="password"
        placeholder="Enter password"
      /><br />
      <input type="submit" name="submit" value="SUBMIT" />
    </form>
    <script>
      function validation() {
        let username = document.myform.username.value;
        let password = document.myform.password.value;
        let valid = false;
        if (username.length < 6) {
          alert("Username must be at least 6 character");
          valid = false;
          return false;
        } else {
          valid = true;
        }
        if (password.length > 8) {
          alert("Password within 8 character long");
          valid = false;
          return false;
        } else {
          valid = true;
        }

        if (password === "") {
          alert("Password must be enter");
          valid = false;
          return false;
        } else {
          valid = true;
        }
        if (valid == true) {
          alert("All are validated");
        }
      }
    </script>
  </body>
</html>
