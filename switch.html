<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let score = Number(prompt("Enter score"));

      switch (true) {
        case score >= 80:
          alert("A+");
          break;
        case score >= 60:
          alert("B");
          break;
        default:
          alert("FAIL");
      }
    </script>
  </body>
</html>
